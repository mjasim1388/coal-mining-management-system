<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f1f5f9;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .denied-box {
            text-align: center;
            max-width: 480px;
            padding: 50px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }
        .denied-box .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: #fef3c7;
            border-radius: 50%;
            margin-bottom: 20px;
        }
        .denied-box .icon-circle i {
            font-size: 40px;
            color: #d97706;
        }
        .denied-box h1 {
            font-size: 42px;
            font-weight: 800;
            margin: 0;
            color: #0f172a;
        }
        .denied-box h5 {
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 700;
        }
        .denied-box p {
            color: #475569;
            margin: 20px 0 30px;
            font-size: 15px;
        }
        .btn-amber {
            background: #f59e0b;
            color: #fff;
            border: none;
            font-weight: 600;
            padding: 11px 26px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            transition: all 0.15s;
        }
        .btn-amber:hover { background: #d97706; color: #fff; }
    </style>
</head>
<body>
    <div class="denied-box">
        <div class="icon-circle">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>403</h1>
        <h5>Access Denied</h5>
        <p>
            You don't have permission to view this page.<br>
            Please contact your administrator if you think this is a mistake.
        </p>
        <a href="/" class="btn-amber">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
