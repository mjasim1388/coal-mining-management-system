<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>

    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('cm-theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-app: #0d1117;
            --bg-panel: #151b23;
            --bg-raised: #1b232d;
            --border-light: #232c38;
            --border-medium: #334050;
            --text-primary: #e6eaf0;
            --text-secondary: #b0bbc8;
            --text-muted: #8391a3;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-ink: #001a10;
            --accent-soft: rgba(16, 185, 129, 0.14);
            --warning: #f59e0b;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-app: #f3f5f8;
            --bg-panel: #ffffff;
            --bg-raised: #f8f9fb;
            --border-light: #e2e6ec;
            --border-medium: #c9d0da;
            --text-primary: #17202b;
            --text-secondary: #455366;
            --text-muted: #6a7788;
            --accent: #059669;
            --accent-hover: #047857;
            --accent-ink: #ffffff;
            --accent-soft: rgba(5, 150, 105, 0.10);
            --warning: #b45309;
            --shadow: 0 20px 60px rgba(16, 24, 40, 0.12);
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            color: var(--text-primary);
            margin: 0;
            -webkit-font-smoothing: antialiased;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
            z-index: 10;
        }
        .theme-toggle:hover { background: var(--bg-raised); color: var(--text-primary); }

        .denied-box {
            text-align: center;
            max-width: 480px;
            padding: 50px 44px;
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin: 20px;
        }
        .denied-box .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: var(--accent-soft);
            border-radius: 50%;
            margin-bottom: 20px;
        }
        .denied-box .icon-circle i {
            font-size: 40px;
            color: var(--accent);
        }
        .denied-box h1 {
            font-size: 44px;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -1px;
        }
        .denied-box h5 {
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 600;
        }
        .denied-box p {
            color: var(--text-secondary);
            margin: 20px 0 30px;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-back {
            background: var(--accent);
            color: var(--accent-ink);
            border: 1px solid var(--accent);
            font-weight: 600;
            padding: 11px 26px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: background 0.12s ease, border-color 0.12s ease;
        }
        .btn-back:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--accent-ink);
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch theme" title="Switch theme">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <div class="denied-box">
        <div class="icon-circle">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>403</h1>
        <h5>Access Denied</h5>
        <p>
            You don't have permission to view this page.<br>
            Please contact your administrator if you think this is a mistake.
        </p>
        <a href="/" class="btn-back">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var icon = document.getElementById('themeIcon');

            function syncIcon() {
                var dark = root.getAttribute('data-theme') === 'dark';
                icon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
            }
            syncIcon();

            document.getElementById('themeToggle').addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('cm-theme', next); } catch (e) {}
                syncIcon();
            });
        })();
    </script>
</body>
</html>
