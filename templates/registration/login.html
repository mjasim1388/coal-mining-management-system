<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coal Mining System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0f172a;
            --border-light: #293548;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --danger-soft: rgba(239, 68, 68, 0.15);
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .login-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .logo-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), #d97706);
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .login-logo .logo-circle i { font-size: 32px; color: #fff; }
        .login-logo h3 {
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0;
            color: var(--text-primary);
            font-size: 20px;
        }
        .login-logo small {
            color: var(--text-muted);
            letter-spacing: 2px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .form-label {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.15s;
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-control:focus {
            background: var(--bg-input);
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }
        .btn-amber {
            background: var(--accent);
            border: none;
            color: #1a1a1a;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            transition: all 0.15s;
        }
        .btn-amber:hover {
            background: var(--accent-hover);
            color: #000;
        }
        .alert-error {
            background: var(--danger-soft);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <div class="logo-circle"><i class="bi bi-gem"></i></div>
            <h3>COALMINE</h3>
            <small>Control System</small>
        </div>

        {% if form.errors %}
            <div class="alert-error">
                <i class="bi bi-exclamation-circle"></i> Invalid username or password.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-amber">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
                </form>

        <div style="text-align:center; margin-top:26px; font-size:12px; color:var(--text-muted); letter-spacing:0.3px;">
            © 2026 Coal Mine System · Developed by <strong style="color:var(--accent);">Muhammad Jasim</strong>
        </div>
    </div>
</body>
</html>
