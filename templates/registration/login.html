{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coal Mining System</title>

    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('cm-theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link href="{% static 'vendor/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <style>
        :root {
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --font-sans: 'Segoe UI', -apple-system, Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-app: #0d1117;
            --bg-panel: #151b23;
            --bg-raised: #1b232d;
            --border-light: #232c38;
            --border-medium: #334050;
            --text-primary: #e6eaf0;
            --text-secondary: #b0bbc8;
            --text-muted: #8391a3;
            --accent: #e5a11c;
            --accent-hover: #f0b43f;
            --accent-ink: #1a1200;
            --accent-soft: rgba(229, 161, 28, 0.14);
            --danger: #ef5b5b;
            --danger-soft: rgba(239, 91, 91, 0.15);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-app: #f3f5f8;
            --bg-panel: #ffffff;
            --bg-raised: #f8f9fb;
            --border-light: #e2e6ec;
            --border-medium: #c9d0da;
            --text-primary: #17202b;
            --text-secondary: #455366;
            --text-muted: #6a7788;
            --accent: #b87708;
            --accent-hover: #9a6206;
            --accent-ink: #ffffff;
            --accent-soft: rgba(184, 119, 8, 0.10);
            --danger: #cf3a3a;
            --danger-soft: rgba(207, 58, 58, 0.09);
            --shadow: 0 20px 60px rgba(16, 24, 40, 0.12);
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            color: var(--text-primary);
            margin: 0;
            -webkit-font-smoothing: antialiased;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
            z-index: 10;
        }
        .theme-toggle:hover { background: var(--bg-raised); color: var(--text-primary); }

        .login-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            margin: 20px;
        }

        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.5s ease;
        }

        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .logo-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
        }
        .login-logo .logo-circle i { font-size: 32px; color: var(--accent-ink); }
        .login-logo h3 {
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-primary);
            font-size: 20px;
        }
        .login-logo small {
            color: var(--text-muted);
            letter-spacing: 2px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-control {
            background: var(--bg-app);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-control:focus {
            background: var(--bg-app);
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .form-control.error-field {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px var(--danger-soft) !important;
        }

        .btn-signin {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: var(--accent-ink);
            font-weight: 600;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease;
        }
        .btn-signin:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--accent-ink);
        }

        .alert-error {
            background: var(--danger-soft);
            border: 1px solid var(--danger);
            border-left-width: 4px;
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .alert-error i {
            color: var(--danger);
            font-size: 20px;
            flex-shrink: 0;
        }

        .login-footer {
            text-align: center;
            margin-top: 26px;
            font-size: 12.5px;
            color: var(--text-muted);
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }
        .login-footer strong { color: var(--text-secondary); font-weight: 600; }

        .caps-warning {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch theme" title="Switch theme">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <div class="login-box" id="loginBox">
        <div class="login-logo">
            <div class="logo-circle"><i class="bi bi-minecart-loaded"></i></div>
            <h3>COALMINE</h3>
            <small>Control System</small>
        </div>

        {% if form.errors %}
            <div class="alert-error" id="loginError">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Invalid username or password. Please try again.</span>
            </div>
        {% endif %}

        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                <div class="caps-warning" id="capsWarning">
                    <i class="bi bi-exclamation-triangle-fill"></i> Caps Lock is ON
                </div>
            </div>
            <button type="submit" class="btn-signin" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <div class="login-footer">
            &copy; 2026 Coal Mine System &middot; Developed by <strong>Muhammad Jasim</strong>
        </div>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var icon = document.getElementById('themeIcon');

            function syncIcon() {
                var dark = root.getAttribute('data-theme') === 'dark';
                icon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
            }
            syncIcon();

            document.getElementById('themeToggle').addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('cm-theme', next); } catch (e) {}
                syncIcon();
            });

            // ---------- SHAKE ON ERROR ----------
            var loginError = document.getElementById('loginError');
            if (loginError) {
                var box = document.getElementById('loginBox');
                box.classList.add('shake');
                setTimeout(function() { box.classList.remove('shake'); }, 600);

                // Highlight both fields red
                var u = document.getElementById('id_username');
                var p = document.getElementById('id_password');
                if (u) u.classList.add('error-field');
                if (p) p.classList.add('error-field');

                // Focus on username for retry
                if (u) setTimeout(function() { u.focus(); u.select(); }, 100);
            }

            // ---------- CAPS LOCK DETECTION ----------
            var pwField = document.getElementById('id_password');
            var capsWarning = document.getElementById('capsWarning');
            if (pwField && capsWarning) {
                pwField.addEventListener('keyup', function(e) {
                    if (e.getModifierState && e.getModifierState('CapsLock')) {
                        capsWarning.style.display = 'block';
                    } else {
                        capsWarning.style.display = 'none';
                    }
                });
                pwField.addEventListener('keydown', function(e) {
                    if (e.getModifierState && e.getModifierState('CapsLock')) {
                        capsWarning.style.display = 'block';
                    } else {
                        capsWarning.style.display = 'none';
                    }
                });
            }

            // ---------- CLEAR ERROR ON INPUT ----------
            var u2 = document.getElementById('id_username');
            var p2 = document.getElementById('id_password');
            [u2, p2].forEach(function(el) {
                if (!el) return;
                el.addEventListener('input', function() {
                    this.classList.remove('error-field');
                });
            });

            // ---------- BUTTON SPINNER ----------
            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            if (form && btn) {
                form.addEventListener('submit', function() {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Signing in...';
                });
            }
        })();
    </script>
</body>
</html>
